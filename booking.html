<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Car | DriveEase</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header class="site-header"><nav class="nav container"><a class="brand" href="index.html"><span class="brand-mark">D</span><span>Drive<span class="brand-accent">Ease</span></span></a><button class="menu-toggle">☰</button><div class="nav-links"><a href="index.html">Home</a><a href="cars.html">Cars</a><a href="index.html#about">About</a><a class="active" href="history.html">Bookings</a><a href="login.html" class="nav-login">Login</a><button id="themeToggle" class="icon-btn">☾</button></div></nav></header>
<main class="page-main"><section class="page-hero small"><div class="container"><span class="eyebrow">RESERVE YOUR RIDE</span><h1>Book a car.</h1><p>Enter your details, choose your dates and confirm your rental.</p></div></section>
<section class="container booking-layout">
  <form id="bookingForm" class="form-card">
    <div class="form-section"><span class="eyebrow">01 · YOUR DETAILS</span><h2>Customer information</h2>
      <div class="form-grid"><label>Full name<input name="name" required minlength="3" placeholder="Your full name"></label><label>Email<input name="email" type="email" required placeholder="you@example.com"></label><label>Phone<input name="phone" required pattern="[0-9+() -]{8,}" placeholder="+91 98765 43210"></label><label>Driving licence<input name="license" required placeholder="Licence number"></label></div>
    </div>
    <div class="form-section"><span class="eyebrow">02 · RENTAL</span><h2>Trip details</h2>
      <div class="form-grid"><label>Choose car<select id="bookingCar" name="carId" required></select></label><label>Pickup date<input id="pickupDate" name="pickup" type="date" required></label><label>Return date<input id="returnDate" name="return" type="date" required></label><label>Pickup location<select name="location" required><option value="">Select location</option><option>City Centre</option><option>Airport</option><option>Railway Station</option><option>DriveEase Main Branch</option></select></label></div>
      <label>Special request<textarea name="note" rows="3" placeholder="Optional request"></textarea></label>
    </div>
    <button class="btn btn-primary btn-wide" type="submit">Confirm Booking →</button>
    <p id="bookingMessage" class="form-message"></p>
  </form>
  <aside id="bookingSummary" class="booking-summary"></aside>
</section></main>
<footer class="footer compact"><div class="container footer-bottom">© 2026 DriveEase</div></footer>
<script src="js/cars.js"></script><script src="js/booking.js"></script><script src="js/app.js"></script>
</body></html>
